name: Insights Cache Native Tests
on:
  push:
    branches: [feature/legacy-db-adapter-v4-20260920]
    paths:
      - 'Dotnet/Insights/**'
      - 'tests/InsightsCache.Native/**'
      - 'tests/InsightsCache.Edges/**'
      - 'tests/InsightsCache.Legacy/**'
      - '.github/workflows/insights-cache-native.yml'
permissions:
  contents: read
concurrency:
  group: insights-cache-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'RICHARDwuxiaofei/VRCX_stalk'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Actual SQLite edge-case regressions
        run: dotnet run --project tests/InsightsCache.Edges/InsightsCache.Edges.csproj -c Release
      - name: Historical official VRCX schema compatibility tests
        run: dotnet run --project tests/InsightsCache.Legacy/InsightsCache.Legacy.csproj -c Release
      - name: Half-million source rows, persistence and incremental tests
        run: dotnet run --project tests/InsightsCache.Native/InsightsCache.Native.csproj -c Release -- --stress
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: insights-cache-native-${{ github.run_number }}
          path: |
            test-results/cache-native.json
            test-results/cache-edges.json
            test-results/cache-legacy.json
          if-no-files-found: warn
